<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>拾音 · 抖音音频</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">♫</span><div><h1>拾音</h1><p>抖音与 B 站助手</p></div></header>
    <div class="intro">边看视频，边保存内容</div>
    <ol>
      <li><span>1</span><p>打开拾音桌面版，并在 Edge 中播放抖音或 B 站视频。</p></li>
      <li><span>2</span><p>点击视频右上角的<strong>保存图标</strong>，选择音频或视频，并允许浏览器打开拾音。</p></li>
      <li><span>3</span><p>在拾音查看进度。音频进入音频库，视频保存在设置的文件夹。</p></li>
    </ol>
    <div class="note"><strong>没有找到按钮？</strong><p>刷新抖音页面；翻页后稍等片刻再试。遇到受限视频，可检查拾音中的抖音登录状态。</p></div>
    <footer>视频水印情况取决于平台返回的画面，画面内已有的水印无法通过下载移除。</footer>
  </main>
</body>
</html>
