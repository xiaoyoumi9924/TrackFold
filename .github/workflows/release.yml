name: Build desktop releases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-media:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: ubuntu-latest
            target: linux
          - os: ubuntu-latest
            target: win32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux media build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential yasm pkg-config
      - name: Install Windows cross-build tools
        if: matrix.target == 'win32'
        run: sudo apt-get install -y mingw-w64
      - name: Build bundled FFmpeg and LAME
        env:
          SHIYIN_BUILD_JOBS: 2
        run: sh scripts/build-media.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: media-${{ matrix.target }}
          path: vendor/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-media
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win32
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: media-${{ matrix.target }}
          path: vendor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:pack -- ${{ matrix.target }}
      - run: node scripts/prepare-release-assets.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "拾音 ${GITHUB_REF_NAME#v}" --generate-notes
